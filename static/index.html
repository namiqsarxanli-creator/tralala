<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF7EA">
  <title>Tralala</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F4483C'/%3E%3Ctext x='16' y='24' font-size='22' text-anchor='middle' fill='white'%3E♪%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="offline" class="offline" hidden>Bağlantı bərpa olunur…</div>
  <div class="phone">
    <div class="phone-top" id="top" hidden></div>
    <main class="phone-main" id="app"></main>
  </div>
  <div class="ask" id="ask" hidden role="dialog" aria-label="AI izahı">
    <div class="ask-head"><b id="askTitle"></b><button class="btn ghost small" id="askClose">Bağla</button></div>
    <div class="ask-note" id="askNote" hidden>Yeni sual başladı! <button class="btn primary small" id="askBack">Suala qayıt</button></div>
    <div class="ask-log" id="askLog"></div>
    <form class="ask-form" id="askForm">
      <input class="field" id="askText" maxlength="300" placeholder="Sualını yaz…" aria-label="AI-a sual" autocomplete="off">
      <button class="btn primary" id="askSend">Soruş</button>
    </form>
  </div>
  <script src="/static/common.js"></script>
  <script src="/static/play.js"></script>
</body>
</html>
